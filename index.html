      function applyBoardFromUrl(showError = true) {
        const requestedBoardId = new URLSearchParams(window.location.search).get("board");
        if (!requestedBoardId) return true;
        const board = state.boards.find(item => item.id === requestedBoardId);
        if (!board) {
          if (showError) showToast("指定されたボードが見つかりません", "⚠️");
          return false;
        }
        activateBoard(board);
        saveToStorage();
        return true;
      }

      function normalizeRemoteBoard(remoteBoard) {
        return normalizeBoard({
          id: remoteBoard.id,
          name: remoteBoard.name,
          description: remoteBoard.description,
          createdAt: remoteBoard.created_at,
          updatedAt: remoteBoard.updated_at,
          theme: remoteBoard.theme,
          currentView: remoteBoard.current_view,
          sections: DEMO_DATA.sections,
          posts: []
        });
      }

      function mergeRemoteBoard(remoteBoard) {
        let localBoard = state.boards.find(board => board.id === remoteBoard.id);
        if (!localBoard) {
          localBoard = normalizeRemoteBoard(remoteBoard);
          state.boards.push(localBoard);
        } else {
          localBoard.name = remoteBoard.name;
          localBoard.description = remoteBoard.description || "";
          localBoard.theme = remoteBoard.theme || localBoard.theme;
          localBoard.currentView = remoteBoard.current_view || localBoard.currentView;
          localBoard.updatedAt = remoteBoard.updated_at || localBoard.updatedAt;
        }
        return localBoard;
      }

      async function joinRemoteBoardFromUrl(boardParameter) {
        const api = window.PadletSupabase;
        if (!api || !api.isConfigured() || !boardParameter) return null;

        let membership;
        if (isSupabaseBoardId(boardParameter)) {
          membership = await api.joinBoard(boardParameter);
        } else if (boardParameter.startsWith("board-")) {
          membership = await api.joinBoardByLegacyId(boardParameter);
        } else {
          return null;
        }

        const client = api.getClient();
        const lookup = boardParameter.startsWith("board-")
          ? client.from(api.TABLES.boards).select("*").eq("legacy_id", boardParameter).maybeSingle()
          : client.from(api.TABLES.boards).select("*").eq("id", boardParameter).maybeSingle();
        const { data, error } = await lookup;
        if (error) throw error;
        return { board: data, membership };
      }

      async function initializeOnlineBoardContext() {
        const api = window.PadletSupabase;
        if (!api || !api.isConfigured()) return;
        const session = await api.initialize();
        if (!session.enabled) return;
        onlineUserId = session.user?.id || null;

        const joinedBoards = await api.listJoinedBoards();
        joinedBoards.filter(Boolean).forEach(remoteBoard => {
          const localBoard = mergeRemoteBoard(remoteBoard);
          if (localBoard.id === state.activeBoardId) {
            onlineBoardRole = remoteBoard.membershipRole || null;
          }
        });

        const boardParameter = new URLSearchParams(window.location.search).get("board");
        if (!boardParameter) {
          renderBoardManager();
          return;
        }

        const remoteResult = await joinRemoteBoardFromUrl(boardParameter);
        if (!remoteResult?.board) return;
        onlineBoardRole = remoteResult.membership?.role || "student";
        const localBoard = mergeRemoteBoard(remoteResult.board);
        activateBoard(localBoard);
        updateBoardUrl(localBoard.id, true);
        const remotePosts = await api.fetchPosts(localBoard.id);
        state.cards = remotePosts.map(mapRemotePost);
        localBoard.posts = state.cards;
        saveToStorage();
        closeBoardManager();
        renderApp();
        startPostsRealtime(localBoard.id);
      }

      function renameBoard(boardId) {
        const board = state.boards.find(item => item.id === boardId);
        if (!board) return;
        const nextName = prompt("新しいボード名を入力してください:", board.name);
        if (!nextName || !nextName.trim()) return;
        board.name = nextName.trim();
        if (board.id === state.activeBoardId) state.title = board.name;
        saveToStorage();
        renderBoardManager();
        renderApp();
        showToast("ボード名を変更しました", "✏️");
      }

      function deleteBoard(boardId) {
        if (state.boards.length <= 1) {
          showToast("最低1つのボードが必要です", "⚠️");
          return;
        }
        const board = state.boards.find(item => item.id === boardId);
        if (!board) return;
        if (!confirm(`「${board.name}」を削除しますか？\nこのボードの投稿、セクション、設定も削除されます。`)) return;
        state.boards = state.boards.filter(item => item.id !== boardId);
        if (boardId === state.activeBoardId) {
          const nextBoard = [...state.boards].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
          state.activeBoardId = nextBoard.id;
          state.title = nextBoard.name;
          state.description = nextBoard.description;
          state.theme = nextBoard.theme;
          state.currentView = nextBoard.currentView;
          state.sections = nextBoard.sections;
          state.cards = nextBoard.posts;
          updateBoardUrl(nextBoard.id, true);
        }
        saveToStorage();
        renderBoardManager();
        renderApp();
        showToast("ボードを削除しました", "🗑️");
      }

      function getFilteredCards() {
        return state.cards.filter(card => {
          const hidden = card.isHidden === true;
          if (!isTeacherMode() && hidden) return false;
          if (isTeacherMode() && visibilityFilter === "visible" && hidden) return false;
          if (isTeacherMode() && visibilityFilter === "hidden" && !hidden) return false;
          // Color filter
          if (state.colorFilter !== "all" && card.color !== state.colorFilter) {
            return false;
          }
          // Search query
          if (state.searchQuery) {
            const q = state.searchQuery.toLowerCase();
            const titleMatch = (card.title || "").toLowerCase().includes(q);
            const contentMatch = (card.content || "").toLowerCase().includes(q);
            const tagMatch = (card.tags || []).some(t => t.toLowerCase().includes(q));
            const commentMatch = (card.comments || []).some(c => (c.text || "").toLowerCase().includes(q));
            if (!titleMatch && !contentMatch && !tagMatch && !commentMatch) {
              return false;
            }
          }
          return true;
        });
      }

      function renderApp() {
        const activeTeacherMode = isTeacherMode();
        teacherModeBadge.textContent = activeTeacherMode ? "🛡️ 先生モード" : "👤 児童モード";
        modeSwitchBtn.textContent = activeTeacherMode ? "児童モードへ戻る" : "先生モードへ";
        modeSwitchBtn.setAttribute("aria-label", activeTeacherMode ? "児童モードへ戻る" : "先生モードへ");
        document.querySelectorAll(".visibility-filter-btn").forEach(button => {
          button.classList.toggle("active", button.dataset.visibilityFilter === visibilityFilter);
        });
        // Update header info
        boardTitleDisplay.textContent = state.title;
        boardDescDisplay.textContent = state.description;

        // Update view tabs
        viewTabs.forEach(tab => {
          if (tab.dataset.view === state.currentView) {
            tab.classList.add("active");
          } else {
            tab.classList.remove("active");
          }
        });

        // Toggle canvas hint
        if (state.currentView === "canvas") {
          canvasHint.style.display = "flex";
        } else {
          canvasHint.style.display = "none";
        }

        // Apply theme
        applyTheme(state.theme || "theme-pastel");

        // Filter cards
        const filteredCards = getFilteredCards();
        cardCountDisplay.textContent = `${filteredCards.length} 件のカード`;

        // Render based on current view
        viewContainer.className = `view-${state.currentView}`;
        viewContainer.innerHTML = "";

        if (state.currentView === "wall") {
          renderWallView(filteredCards);
        } else if (state.currentView === "sections") {
          renderSectionsView(filteredCards);
        } else if (state.currentView === "canvas") {
          renderCanvasView(filteredCards);
        }
      }

      // 1. Render Wall View (Masonry-like responsive grid)
      function renderWallView(cards) {
        if (cards.length === 0) {
          viewContainer.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <h3>カードが見つかりません</h3>
              <p>検索条件を変更するか、右下の「+」ボタンから新しいカードを投稿しましょう！</p>
            </div>
          `;
          return;
        }

        // Sort: pinned cards first
        const sorted = [...cards].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
        sorted.forEach(card => {
          const cardEl = createCardElement(card, false);
          viewContainer.appendChild(cardEl);
        });
      }

      // 2. Render Sections View (Kanban style columns)
      function renderSectionsView(cards) {
        state.sections.forEach(sec => {
          const secCards = cards.filter(c => c.sectionId === sec.id);

          const colEl = document.createElement("div");
          colEl.className = "section-column";
          colEl.dataset.sectionId = sec.id;

          // Drag and drop events for column
          colEl.addEventListener("dragover", (e) => {
            e.preventDefault();
            colEl.classList.add("drag-over");
          });
          colEl.addEventListener("dragleave", () => {
            colEl.classList.remove("drag-over");
          });
          colEl.addEventListener("drop", (e) => {
            e.preventDefault();
            colEl.classList.remove("drag-over");
            const draggedCardId = e.dataTransfer.getData("text/plain");
            if (draggedCardId) {
              moveCardToSection(draggedCardId, sec.id);
            }
          });

          colEl.innerHTML = `
            <div class="section-header">
              <div class="section-title">
                <span>${escapeHtml(sec.title)}</span>
                <span class="section-count">${secCards.length}</span>
              </div>
              <button class="card-menu-btn delete-sec-btn" title="セクションを削除" data-sec-id="${sec.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="section-cards-list" id="sec-list-${sec.id}"></div>
            <button class="section-add-card-btn" data-sec-id="${sec.id}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              カードを追加
            </button>
          `;

          const listEl = colEl.querySelector(`#sec-list-${sec.id}`);
          secCards.forEach(card => {
            const cardEl = createCardElement(card, true);
            listEl.appendChild(cardEl);
          });

          // Delete section handler
          colEl.querySelector(".delete-sec-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            if (state.sections.length <= 1) {
              showToast("最低1つのセクションが必要です", "⚠️");
              return;
            }
            if (confirm(`セクション「${sec.title}」を削除しますか？\n（含まれるカードは他のセクションへ移動します）`)) {
              deleteSection(sec.id);
            }
          });

          // Add card to this section handler
          colEl.querySelector(".section-add-card-btn").addEventListener("click", () => {
            openPostModal(null, sec.id);
          });

          viewContainer.appendChild(colEl);
        });

        // "Add Section" Column
        const addCol = document.createElement("div");
        addCol.className = "add-section-col";
        addCol.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>新しいセクションを追加</span>
        `;
        addCol.addEventListener("click", () => {
          const title = prompt("新しいセクション名を入力してください:", "新セクション");
          if (title && title.trim()) {
            state.sections.push({
              id: generateId("sec"),
              title: title.trim()
            });
            saveToStorage();
            renderApp();
            showToast("セクションを追加しました");
          }
        });
        viewContainer.appendChild(addCol);
      }

      // 3. Render Canvas View (Freeform X/Y placement)
      function renderCanvasView(cards) {
        cards.forEach(card => {
          const cardEl = createCardElement(card, false, true);
          // Set position
          cardEl.style.left = `${card.canvasX || 60}px`;
          cardEl.style.top = `${card.canvasY || 60}px`;
          setupCanvasDragging(cardEl, card);
          viewContainer.appendChild(cardEl);
        });

        // Double click anywhere on canvas to create note at that position
        viewContainer.ondblclick = (e) => {
          if (e.target === viewContainer) {
            const rect = viewContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + viewContainer.scrollLeft;
            const y = e.clientY - rect.top + viewContainer.scrollTop;
            openPostModal(null, null, { x: Math.max(20, Math.floor(x)), y: Math.max(20, Math.floor(y)) });
          }
        };
      }

      // Setup Canvas Freeform Dragging
      function setupCanvasDragging(element, card) {
        let isDragging = false;
        let startX, startY;
        let initialX, initialY;

        element.addEventListener("mousedown", (e) => {
          // Don't drag if clicking buttons, inputs, links, or comments
          if (e.target.closest("button") || e.target.closest("input") || e.target.closest("a") || e.target.closest(".card-comments-drawer")) {
            return;
          }
          isDragging = true;
          element.classList.add("dragging");
          startX = e.clientX;
          startY = e.clientY;
          initialX = element.offsetLeft;
          initialY = element.offsetTop;

          // Bring card to front
          const allCards = document.querySelectorAll(".card.in-canvas");
          allCards.forEach(c => c.style.zIndex = "10");
          element.style.zIndex = "30";

          function onMouseMove(ev) {
            if (!isDragging) return;
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            const newX = Math.max(10, initialX + dx);
            const newY = Math.max(10, initialY + dy);
            element.style.left = `${newX}px`;
            element.style.top = `${newY}px`;
          }

          function onMouseUp(ev) {
            if (!isDragging) return;
            isDragging = false;
            element.classList.remove("dragging");
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);

            // Update card position in state
            card.canvasX = element.offsetLeft;
            card.canvasY = element.offsetTop;
            saveToStorage();
          }

          window.addEventListener("mousemove", onMouseMove);
          window.addEventListener("mouseup", onMouseUp);
        });
      }

      // Move card to another section
      function moveCardToSection(cardId, targetSectionId) {
        const card = state.cards.find(c => c.id === cardId);
        if (card && card.sectionId !== targetSectionId) {
          card.sectionId = targetSectionId;
          saveToStorage();
          renderApp();
          showToast("カードを移動しました");
        }
      }

      // Delete section and migrate its cards
      function deleteSection(secId) {
        const remaining = state.sections.filter(s => s.id !== secId);
        const fallbackSecId = remaining[0].id;
        state.cards.forEach(c => {
          if (c.sectionId === secId) {
            c.sectionId = fallbackSecId;
          }
        });
        state.sections = remaining;
        saveToStorage();
        renderApp();
        showToast("セクションを削除しました");
      }

      async function deletePost(card) {
        if (!canDeletePost(card)) {
          showToast("この投稿を削除できる権限がありません。", "⚠️");
          return;
        }
        if (!confirm(`「${card.title}」を削除しますか？`)) return;
        if (isOnlineBoard()) {
          try {
            await window.PadletSupabase.deletePost(card.id, state.activeBoardId);
          } catch (error) {
            showToast("オンライン投稿を削除できませんでした。", "⚠️");
            console.warn("Supabase post deletion failed:", error.message);
            return;
          }
        }
        state.cards = state.cards.filter(item => item.id !== card.id);
        saveToStorage();
        renderApp();
        showToast("投稿を削除しました", "🗑️");
      }

      function setPostVisibility(card) {
        if (!canManageVisibility()) {
          showToast("投稿の表示状態を変更できるのは先生だけです。", "⚠️");
          return;
        }
        card.isHidden = card.isHidden !== true;
        saveToStorage();
        renderApp();
        showToast(card.isHidden ? "投稿を非表示にしました" : "投稿を再表示しました", card.isHidden ? "🙈" : "👁️");
      }

      // ======================================================================
      // Create Individual Card DOM Element
      // ======================================================================
      function createCardElement(card, draggable = false, isCanvas = false) {
        const el = document.createElement("div");
        el.className = `card card-color-${card.color || 'yellow'}`;
        el.id = card.id;
        const studentNumber = Number(card.studentNumber);
        const studentLabel = Number.isInteger(studentNumber) && studentNumber > 0
          ? `No.${studentNumber}`
          : "No.--";

        if (isCanvas) {
          el.classList.add("in-canvas");
        }

        if (draggable) {
          el.draggable = true;
          el.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", card.id);
            el.classList.add("dragging");
          });
          el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
          });
        }

        // Section title badge
        const section = state.sections.find(s => s.id === card.sectionId);
        const sectionBadge = (state.currentView !== "sections" && section) 
          ? `<span class="tag-chip" style="background: rgba(0,0,0,0.08); font-size: 0.68rem; margin-bottom: 4px;">📂 ${escapeHtml(section.title)}</span>`
          : "";

        // Pin badge
        const pinBadge = card.pinned 
          ? `<div class="card-pinned-badge" title="ピン留め済み">📌</div>`
          : "";

        // Image Attachment
        let imageHtml = "";
        if (card.imageUrl) {
          imageHtml = `
            <div class="card-image-wrap" data-img-url="${escapeHtml(card.imageUrl)}">
              <img src="${escapeHtml(card.imageUrl)}" alt="${escapeHtml(card.title)}" class="card-image" loading="lazy">
            </div>
          `;
        }

        // Link Attachment
        let linkHtml = "";
        if (card.linkUrl) {
          try {
            const parsedUrl = new URL(card.linkUrl);
            linkHtml = `
              <a href="${escapeHtml(card.linkUrl)}" target="_blank" rel="noopener noreferrer" class="card-link-preview" title="${escapeHtml(card.linkUrl)}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span class="card-link-title">${escapeHtml(parsedUrl.hostname)}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.5;">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </a>
            `;
          } catch(e) {}
        }

        // Checklist Items
        let checklistHtml = "";
        if (card.checklist && card.checklist.length > 0) {
          checklistHtml = `
            <div class="card-checklist">
              ${card.checklist.map((item, idx) => `
                <label class="checklist-item ${item.done ? 'done' : ''}" data-idx="${idx}">
                  <input type="checkbox" ${item.done ? 'checked' : ''}>
                  <span>${escapeHtml(item.text)}</span>
                </label>
              `).join("")}
            </div>
          `;
        }

        // Tags
        let tagsHtml = "";
        if (card.tags && card.tags.length > 0) {
          tagsHtml = `
            <div class="card-tags">
              ${card.tags.map(tag => `<span class="tag-chip" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</span>`).join("")}
            </div>
          `;
        }

        // Comments count
        const commentsCount = (card.comments || []).length;
        const hiddenPost = card.isHidden === true;
        const hiddenLabelHtml = isTeacherMode() && hiddenPost
          ? `<span class="hidden-post-label">非表示</span>`
          : "";
        const editButtonHtml = canEditPost(card) ? `
              <button class="card-menu-btn edit-card-btn" title="編集">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
            ` : "";
        const deleteButtonHtml = canDeletePost(card) ? `
              <button class="card-menu-btn delete-card-btn" title="削除">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            ` : "";
        const visibilityButtonHtml = canManageVisibility() ? `
              <button class="card-menu-btn visibility-post-btn" title="${hiddenPost ? "表示" : "非表示"}">
                ${hiddenPost ? "表示" : "非表示"}
              </button>
            ` : "";

        // Card HTML Skeleton
        el.innerHTML = `
          ${pinBadge}
          <div class="card-header">
            <div class="card-user-info">
              <div class="card-avatar">${studentLabel.replace("No.", "")}</div>
              <div class="card-meta">
                <span class="card-author">${studentLabel} ${hiddenLabelHtml}</span>
                <span class="card-date">${formatRelativeTime(card.createdAt)}</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 2px;">
              ${editButtonHtml}
              ${visibilityButtonHtml}
              ${deleteButtonHtml}
            </div>
          </div>

          ${imageHtml}

          <div class="card-body">
            ${sectionBadge}
            <h4 class="card-title">${escapeHtml(card.title)}</h4>
            ${card.content ? `<div class="card-content">${escapeHtml(card.content)}</div>` : ''}
            ${linkHtml}
            ${checklistHtml}
            ${tagsHtml}
          </div>

          <div class="card-footer">
            <div class="card-footer-left">
              <button class="card-actions-btn like-btn ${card.isLiked ? 'liked' : ''}" title="いいね">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${card.isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span class="like-count">${card.likes || 0}</span>
              </button>
              <button class="card-actions-btn toggle-comments-btn" title="コメント">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>${commentsCount}</span>
              </button>
            </div>
          </div>

          <!-- Comments Drawer -->
          <div class="card-comments-drawer" id="comments-${card.id}">
            <div class="comments-list">
              ${(card.comments || []).map(c => `
                <div class="comment-item">
                  <div class="card-avatar" style="width: 20px; height: 20px; font-size: 0.65rem;">${(c.author || 'M').charAt(0)}</div>
                  <div>
                    <span class="comment-author">${escapeHtml(c.author)}</span>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                  </div>
                </div>
              `).join("")}
            </div>
            <form class="comment-form">
              <input type="text" class="comment-input" placeholder="コメントを入力..." required>
              <button type="submit" class="comment-submit-btn" title="送信">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </form>
          </div>
        `;

        // Event: Lightbox image zoom
        const imgWrap = el.querySelector(".card-image-wrap");
        if (imgWrap) {
          imgWrap.addEventListener("click", () => {
            lightboxImg.src = card.imageUrl;
            lightboxOverlay.classList.add("active");
          });
        }

        // Event: Checklist item toggle
        el.querySelectorAll(".checklist-item input[type='checkbox']").forEach((cb, idx) => {
          cb.addEventListener("change", (e) => {
            e.stopPropagation();
            if (card.checklist && card.checklist[idx]) {
              card.checklist[idx].done = cb.checked;
              saveToStorage();
              renderApp();
            }
          });
        });

        // Event: Tag click to search filter
        el.querySelectorAll(".tag-chip[data-tag]").forEach(chip => {
          chip.addEventListener("click", (e) => {
            e.stopPropagation();
            searchInput.value = chip.dataset.tag;
            state.searchQuery = chip.dataset.tag;
            renderApp();
          });
        });

        // Event: Like button
        const likeBtn = el.querySelector(".like-btn");
        likeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          card.isLiked = !card.isLiked;
          card.likes = (card.likes || 0) + (card.isLiked ? 1 : -1);
          saveToStorage();
          renderApp();
        });

        // Event: Toggle comments drawer
        const toggleCommentsBtn = el.querySelector(".toggle-comments-btn");
        const commentsDrawer = el.querySelector(".card-comments-drawer");
        toggleCommentsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          commentsDrawer.classList.toggle("open");
        });

        // Event: Add Comment
        const commentForm = el.querySelector(".comment-form");
        const commentInput = el.querySelector(".comment-input");
        commentForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const text = commentInput.value.trim();
          if (!text) return;
          if (!card.comments) card.comments = [];
          card.comments.push({
            author: "あなた",
            text: text,
            time: "たった今"
          });
          commentInput.value = "";
          saveToStorage();
          renderApp();
          showToast("コメントを追加しました", "💬");
        });

        // Event: Edit Card
        const editCardBtn = el.querySelector(".edit-card-btn");
        if (editCardBtn) {
          editCardBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!canEditPost(card)) {
              showToast("この投稿を編集できるのは投稿者本人だけです。", "⚠️");
              return;
            }
            openPostModal(card);
          });
        }

        // Event: Delete Card
        const deleteCardBtn = el.querySelector(".delete-card-btn");
        if (deleteCardBtn) {
          deleteCardBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            deletePost(card);
          });
        }
        const visibilityPostBtn = el.querySelector(".visibility-post-btn");
        if (visibilityPostBtn) {
          visibilityPostBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            setPostVisibility(card);
          });
        }

        return el;
      }

      // ======================================================================
      // Modal Logic (Create & Edit Post)
      // ======================================================================
      let initialModalCoords = null;

      function openPostModal(cardToEdit = null, defaultSecId = null, coords = null) {
        if (cardToEdit && !canEditPost(cardToEdit)) {
          showToast("この投稿を編集できるのは投稿者本人だけです。", "⚠️");
          return;
        }
        state.editingCardId = cardToEdit ? cardToEdit.id : null;
        initialModalCoords = coords;

        // Populate sections dropdown
        cardSectionSelect.innerHTML = state.sections.map(s => `
          <option value="${s.id}">${escapeHtml(s.title)}</option>
        `).join("");

        // Reset checklist builder
        checklistBuilder.innerHTML = "";

        if (cardToEdit) {
          postModalTitle.textContent = "カードを編集";
          cardIdInput.value = cardToEdit.id;
          studentNumberInput.disabled = true;
          studentNumberInput.value = Number.isInteger(Number(cardToEdit.studentNumber)) && Number(cardToEdit.studentNumber) > 0
            ? Number(cardToEdit.studentNumber)
            : "";
          cardTitleInput.value = cardToEdit.title || "";
          cardSectionSelect.value = cardToEdit.sectionId || (state.sections[0] ? state.sections[0].id : "");
          cardContentInput.value = cardToEdit.content || "";
          cardImageUrlInput.value = cardToEdit.imageUrl || "";
          cardLinkInput.value = cardToEdit.linkUrl || "";
          cardTagsInput.value = (cardToEdit.tags || []).join(", ");
          cardPinnedInput.checked = !!cardToEdit.pinned;

          // Select color
          selectColorSwatch(cardToEdit.color || "yellow");

          // Image preview
          if (cardToEdit.imageUrl) {
            imagePreviewImg.src = cardToEdit.imageUrl;
            imagePreviewWrap.style.display = "block";
            state.activeImageBase64 = cardToEdit.imageUrl;
          } else {
            imagePreviewWrap.style.display = "none";
            state.activeImageBase64 = "";
          }

          // Populate checklist builder
          if (cardToEdit.checklist && cardToEdit.checklist.length > 0) {
            cardToEdit.checklist.forEach(item => addChecklistInputRow(item.text, item.done));
          }
        } else {
          postModalTitle.textContent = "新しいカードを投稿";
          postForm.reset();
          cardIdInput.value = "";
          studentNumberInput.disabled = false;
          studentNumberInput.value = currentStudentNumber || "";
          if (defaultSecId) {
            cardSectionSelect.value = defaultSecId;
          }
          selectColorSwatch("yellow");
          imagePreviewWrap.style.display = "none";
          state.activeImageBase64 = "";
        }

        postModal.classList.add("active");
        setTimeout(() => studentNumberInput.focus(), 150);
      }

      function closePostModal() {
        postModal.classList.remove("active");
        state.editingCardId = null;
        state.activeImageBase64 = "";
        studentNumberInput.disabled = false;
      }

      function selectColorSwatch(color) {
        document.querySelectorAll(".color-swatch-item").forEach(swatch => {
          if (swatch.dataset.cardColor === color) {
            swatch.classList.add("selected");
          } else {
            swatch.classList.remove("selected");
          }
        });
      }

      function getSelectedCardColor() {
        const selected = document.querySelector(".color-swatch-item.selected");
        return selected ? selected.dataset.cardColor : "yellow";
      }

      // Add row to checklist builder
      function addChecklistInputRow(text = "", done = false) {
        const row = document.createElement("div");
        row.className = "checklist-builder-item";
        row.innerHTML = `
          <input type="checkbox" ${done ? 'checked' : ''} class="cb-done" style="accent-color: var(--primary);">
          <input type="text" class="form-input cb-text" value="${escapeHtml(text)}" placeholder="項目名を入力...">
          <button type="button" class="checklist-delete-btn" title="削除">✕</button>
        `;
        row.querySelector(".checklist-delete-btn").addEventListener("click", () => row.remove());
        checklistBuilder.appendChild(row);
      }

      // Handle Image File Upload (Base64)
      cardImageFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          alert("画像ファイルサイズが2MBを超えています。より軽量な画像を選択してください。");
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          state.activeImageBase64 = ev.target.result;
          imagePreviewImg.src = ev.target.result;
          imagePreviewWrap.style.display = "block";
          cardImageUrlInput.value = "";
        };
        reader.readAsDataURL(file);
      });

      // Handle Image URL input
      cardImageUrlInput.addEventListener("input", () => {
        const val = cardImageUrlInput.value.trim();
        if (val) {
          state.activeImageBase64 = val;
          imagePreviewImg.src = val;
          imagePreviewWrap.style.display = "block";
        }
      });

      // Remove Image button
      removeImageBtn.addEventListener("click", () => {
        state.activeImageBase64 = "";
        imagePreviewImg.src = "";
        imagePreviewWrap.style.display = "none";
        cardImageUrlInput.value = "";
        cardImageFileInput.value = "";
      });

      // Post Form Submission
      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = cardTitleInput.value.trim();
        if (!title) return;
        const editingCard = state.editingCardId
          ? state.cards.find(card => card.id === state.editingCardId)
          : null;
        if (editingCard && !canEditPost(editingCard)) {
          closePostModal();
          showToast("この投稿を編集できるのは投稿者本人だけです。", "⚠️");
          return;
        }
        const studentNumber = editingCard
          ? getValidStudentNumber(editingCard.studentNumber)
          : getValidStudentNumber(studentNumberInput.value);
        if (!studentNumber) {
          studentNumberInput.setCustomValidity("出席番号は1以上の整数で入力してください。");
          studentNumberInput.reportValidity();
          studentNumberInput.focus();
          return;
        }
        studentNumberInput.setCustomValidity("");
        if (!editingCard) setCurrentStudentNumber(studentNumber);

        // Extract checklist
        const checklistItems = [];
        checklistBuilder.querySelectorAll(".checklist-builder-item").forEach(row => {
          const text = row.querySelector(".cb-text").value.trim();
          const done = row.querySelector(".cb-done").checked;
          if (text) {
            checklistItems.push({ id: generateId("chk"), text, done });
          }
        });

        // Extract tags
        const tags = cardTagsInput.value
          .split(/[,、]/)
          .map(t => t.trim().replace(/^#/, ""))
          .filter(t => t.length > 0);

        // Final image url
        let finalImage = state.activeImageBase64 || cardImageUrlInput.value.trim();
        let onlinePost = null;

        if (isOnlineBoard()) {
          try {
            const onlinePayload = getOnlinePostPayload(editingCard || {}, studentNumber, {
              title,
              sectionId: null,
              content: cardContentInput.value.trim(),
              color: getSelectedCardColor(),
              imageUrl: finalImage,
              linkUrl: cardLinkInput.value.trim(),
              pinned: cardPinnedInput.checked,
              canvasX: initialModalCoords ? initialModalCoords.x : (editingCard?.canvasX ?? 100),
              canvasY: initialModalCoords ? initialModalCoords.y : (editingCard?.canvasY ?? 100)
            });
            onlinePost = editingCard
              ? await window.PadletSupabase.updatePost(editingCard.id, onlinePayload)
              : await window.PadletSupabase.createPost(onlinePayload);
          } catch (error) {
            showToast("オンライン投稿を保存できませんでした。", "⚠️");
            console.warn("Supabase post save failed:", error.message);
            return;
          }
        }

        if (editingCard) {
          // Edit existing card
          editingCard.title = title;
          editingCard.sectionId = cardSectionSelect.value;
          editingCard.content = cardContentInput.value.trim();
          editingCard.color = getSelectedCardColor();
          editingCard.imageUrl = finalImage;
          editingCard.linkUrl = cardLinkInput.value.trim();
          editingCard.checklist = checklistItems;
          editingCard.tags = tags;
          editingCard.pinned = cardPinnedInput.checked;
          editingCard.lastEditedBy = isTeacherMode() ? "teacher" : "student";
          editingCard.lastEditedAt = new Date().toISOString();
          showToast("カードを更新しました", "✏️");
        } else {
          // Create new card
          const newCard = {
            id: onlinePost?.id || generateId("card"),
            boardId: onlinePost?.board_id || null,
            authorUserId: onlinePost?.author_user_id || null,
            studentNumber: studentNumber,
            isHidden: false,
            sectionId: cardSectionSelect.value || (state.sections[0] ? state.sections[0].id : "sec-default"),
            title: title,
            content: cardContentInput.value.trim(),
            color: getSelectedCardColor(),
            imageUrl: finalImage,
            linkUrl: cardLinkInput.value.trim(),
            checklist: checklistItems,
            tags: tags,
            pinned: cardPinnedInput.checked,
            likes: 0,
            isLiked: false,
            createdAt: onlinePost?.created_at || new Date().toISOString(),
            canvasX: onlinePost?.canvas_x ?? (initialModalCoords ? initialModalCoords.x : (100 + Math.floor(Math.random() * 200))),
            canvasY: onlinePost?.canvas_y ?? (initialModalCoords ? initialModalCoords.y : (100 + Math.floor(Math.random() * 200))),
            comments: []
          };
          state.cards = state.cards.filter(card => card.id !== newCard.id);
          state.cards.unshift(newCard);
          showToast("新しいカードを投稿しました！", "🎉");
        }

        saveToStorage();
        closePostModal();
        renderApp();
      });

      // ======================================================================
      // Board Title & Description Edit
      // ======================================================================
      boardTitleDisplay.addEventListener("click", () => {
        boardTitleInput.value = state.title;
        boardDescInput.value = state.description;
        titleModal.classList.add("active");
        setTimeout(() => boardTitleInput.focus(), 150);
      });

      titleForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const t = boardTitleInput.value.trim();
        if (t) {
          state.title = t;
          state.description = boardDescInput.value.trim();
          saveToStorage();
          renderApp();
          titleModal.classList.remove("active");
          showToast("ボード情報を更新しました", "📝");
        }
      });

      boardManagerBtn.addEventListener("click", openBoardManager);
      closeBoardManagerBtn.addEventListener("click", closeBoardManager);
      boardManagerModal.addEventListener("click", (e) => {
        if (e.target === boardManagerModal) closeBoardManager();
      });
      boardSearchInput.addEventListener("input", renderBoardManager);
      newBoardBtn.addEventListener("click", openNewBoardModal);
      modeSwitchBtn.addEventListener("click", () => {
        if (isTeacherMode()) {
          setTeacherMode(false);
          showToast("児童モードに戻りました", "👤");
        } else {
          openTeacherAuthModal();
        }
      });
      teacherModeBtn.addEventListener("click", () => {
        if (isTeacherMode()) {
          setTeacherMode(false);
          renderBoardManager();
          showToast("児童モードに戻りました", "👤");
        } else {
          openTeacherAuthModal();
        }
      });
      closeTeacherAuthBtn.addEventListener("click", closeTeacherAuthModal);
      cancelTeacherAuthBtn.addEventListener("click", closeTeacherAuthModal);
      teacherAuthModal.addEventListener("click", (e) => {
        if (e.target === teacherAuthModal) closeTeacherAuthModal();
      });
      teacherAuthForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        teacherAuthError.textContent = "";
        const password = teacherPasswordInput.value;
        const storedHash = getTeacherPasswordHash();
        try {
          const passwordHash = await hashTeacherPassword(password);
          if (!storedHash) {
            if (!password || password !== teacherPasswordConfirmInput.value) {
              teacherAuthError.textContent = "パスワードが一致しません。";
              return;
            }
            localStorage.setItem(TEACHER_AUTH_STORAGE_KEY, JSON.stringify({
              passwordHash,
              createdAt: new Date().toISOString()
            }));
            closeTeacherAuthModal();
            setTeacherMode(true);
            showToast("先生モードを設定しました", "🔐");
            return;
          }
          if (passwordHash !== storedHash) {
            teacherAuthError.textContent = "パスワードが正しくありません。";
            return;
          }
          closeTeacherAuthModal();
          setTeacherMode(true);
          showToast("先生モードになりました", "🔐");
        } catch (error) {
          teacherAuthError.textContent = error.message;
        }
      });
      closeNewBoardBtn.addEventListener("click", closeNewBoardModal);
      cancelNewBoardBtn.addEventListener("click", closeNewBoardModal);
      newBoardModal.addEventListener("click", (e) => {
        if (e.target === newBoardModal) closeNewBoardModal();
      });
      [recentBoardList, allBoardList].forEach(list => {
        list.addEventListener("click", (e) => {
          const button = e.target.closest("button[data-board-id]");
          if (!button) return;
          const boardId = button.dataset.boardId;
          if (button.classList.contains("board-rename-btn")) renameBoard(boardId);
          if (button.classList.contains("board-delete-btn")) deleteBoard(boardId);
          if (button.classList.contains("board-share-btn")) openShareBoardModal(boardId);
          if (button.classList.contains("board-open-btn")) switchBoard(boardId);
        });
      });
      closeShareBoardBtn.addEventListener("click", closeShareBoardModal);
      cancelShareBoardBtn.addEventListener("click", closeShareBoardModal);
      shareBoardModal.addEventListener("click", (e) => {
        if (e.target === shareBoardModal) closeShareBoardModal();
      });
      copyShareUrlBtn.addEventListener("click", copyShareUrl);
      showQrCodeBtn.addEventListener("click", () => {
        qrCodeWrap.classList.add("visible");
      });
      printQrCodeBtn.addEventListener("click", () => {
        qrCodeWrap.classList.add("visible");
        window.print();
      });
      newBoardForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = newBoardNameInput.value.trim();
        if (!name) return;
        const now = new Date().toISOString();
        const description = newBoardDescriptionInput.value.trim();
        let remoteBoard = null;
        if (window.PadletSupabase?.isConfigured()) {
          try {
            await window.PadletSupabase.initialize();
            remoteBoard = await window.PadletSupabase.createBoard({
              name,
              description,
              theme: "theme-pastel",
              currentView: "wall"
            });
            onlineBoardRole = "teacher";
            onlineUserId = (await window.PadletSupabase.getCurrentUser())?.id || onlineUserId;
          } catch (error) {
            showToast("オンライン掲示板を作成できないため、この端末に保存します。", "⚠️");
            console.warn("Supabase board creation failed:", error.message);
          }
        }
        const newBoard = normalizeBoard(remoteBoard ? {
          id: remoteBoard.id,
          name: remoteBoard.name,
          description: remoteBoard.description,
          createdAt: remoteBoard.created_at || now,
          updatedAt: remoteBoard.updated_at || now,
          theme: remoteBoard.theme || "theme-pastel",
          currentView: remoteBoard.current_view || "wall",
          sections: DEMO_DATA.sections,
          posts: []
        } : {
          id: generateId("board"),
          name,
          description,
          createdAt: now,
          updatedAt: now,
          theme: "theme-pastel",
          currentView: "wall",
          sections: DEMO_DATA.sections,
          posts: []
        });
        state.boards.push(newBoard);
        closeNewBoardModal();
        switchBoard(newBoard.id);
      });

      window.addEventListener("popstate", () => {
        stopPostsRealtime();
        if (applyBoardFromUrl()) {
          closeBoardManager();
          closeShareBoardModal();
          renderApp();
        }
        initializeOnlineBoardContext().catch(error => {
          console.warn("Supabase board navigation was skipped:", error.message);
        });
      });

      window.addEventListener("pagehide", stopPostsRealtime);
      window.addEventListener("beforeunload", stopPostsRealtime);

      // ======================================================================
      // Event Listeners & Interactions
      // ======================================================================

      // Switch View Modes
      viewTabs.forEach(tab => {
        tab.addEventListener("click", () => {
          state.currentView = tab.dataset.view;
          saveToStorage();
          renderApp();
        });
      });

      // Search Filter
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value.trim();
        renderApp();
      });

      // Color Filter Pills
      colorPills.forEach(pill => {
        pill.addEventListener("click", () => {
          colorPills.forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
          state.colorFilter = pill.dataset.color;
          renderApp();
        });
      });

      document.querySelectorAll(".visibility-filter-btn").forEach(button => {
        button.addEventListener("click", () => {
          if (!isTeacherMode()) return;
          visibilityFilter = button.dataset.visibilityFilter;
          renderApp();
        });
      });

      // Color swatches in modal
      document.querySelectorAll(".color-swatch-item").forEach(swatch => {
        swatch.addEventListener("click", () => {
          selectColorSwatch(swatch.dataset.cardColor);
        });
      });

      // Add Checklist item in modal
      addChecklistItemBtn.addEventListener("click", () => addChecklistInputRow());

      // Open Modal Buttons
      fabBtn.addEventListener("click", () => openPostModal());

      // Close Modal Buttons
      document.getElementById("closePostModalBtn").addEventListener("click", closePostModal);
      document.getElementById("cancelPostModalBtn").addEventListener("click", closePostModal);
      document.getElementById("closeTitleModalBtn").addEventListener("click", () => titleModal.classList.remove("active"));
      document.getElementById("cancelTitleModalBtn").addEventListener("click", () => titleModal.classList.remove("active"));

      // Close modals when clicking outside
      postModal.addEventListener("click", (e) => {
        if (e.target === postModal) closePostModal();
      });
      titleModal.addEventListener("click", (e) => {
        if (e.target === titleModal) titleModal.classList.remove("active");
      });

      // Lightbox Close
      lightboxOverlay.addEventListener("click", () => {
        lightboxOverlay.classList.remove("active");
      });

      // Theme Dropdown Menu
      themeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        themeMenu.classList.toggle("show");
        moreMenu.classList.remove("show");
      });

      document.querySelectorAll("[data-theme]").forEach(item => {
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          applyTheme(item.dataset.theme);
          themeMenu.classList.remove("show");
          showToast("背景テーマを変更しました", "🎨");
        });
      });

      // More Options Dropdown
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        moreMenu.classList.toggle("show");
        themeMenu.classList.remove("show");
      });

      // Close dropdowns on outside click
      window.addEventListener("click", () => {
        themeMenu.classList.remove("show");
        moreMenu.classList.remove("show");
      });

      // Share Board Button
      shareBtn.addEventListener("click", () => {
        moreMenu.classList.remove("show");
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href).then(() => {
            showToast("ボードのURLをコピーしました！", "🔗");
          });
        } else {
          showToast("URL: " + window.location.href, "🔗");
        }
      });

      // Export JSON
      exportBtn.addEventListener("click", () => {
        moreMenu.classList.remove("show");
        const exportData = {
          title: state.title,
          description: state.description,
          theme: state.theme,
          sections: state.sections,
          cards: state.cards,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `padlet-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("データをJSONとしてダウンロードしました", "📥");
      });

      // Import JSON
      importBtn.addEventListener("click", () => {
        moreMenu.classList.remove("show");
        importFileInput.click();
      });

      importFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (imported.cards && Array.isArray(imported.cards)) {
              state.title = imported.title || state.title;
              state.description = imported.description || state.description;
              state.theme = imported.theme || state.theme;
              state.sections = imported.sections || state.sections;
              state.cards = imported.cards;
              saveToStorage();
              renderApp();
              showToast("データを正常にインポートしました！", "✅");
            } else {
              alert("無効なPadletデータ形式です。");
            }
          } catch (err) {
            alert("JSONの読み込みに失敗しました: " + err.message);
          }
        };
        reader.readAsText(file);
        importFileInput.value = "";
      });

      // Reset to Demo Data
      resetDemoBtn.addEventListener("click", () => {
        moreMenu.classList.remove("show");
        if (confirm("すべてのカードと設定を初期のサンプル状態に復元しますか？")) {
          state.title = DEMO_DATA.title;
          state.description = DEMO_DATA.description;
          state.theme = DEMO_DATA.theme;
          state.sections = JSON.parse(JSON.stringify(DEMO_DATA.sections));
          state.cards = JSON.parse(JSON.stringify(DEMO_DATA.cards));
          state.currentView = "wall";
          saveToStorage();
          renderApp();
          showToast("サンプルデータに復元しました", "🔄");
        }
      });

      // Keyboard Shortcuts
      window.addEventListener("keydown", (e) => {
        // Ctrl/Cmd + N -> New Post
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n") {
          e.preventDefault();
          openPostModal();
        }
        // Escape -> Close Modals
        if (e.key === "Escape") {
          if (lightboxOverlay.classList.contains("active")) {
            lightboxOverlay.classList.remove("active");
          } else if (postModal.classList.contains("active")) {
            closePostModal();
          } else if (titleModal.classList.contains("active")) {
            titleModal.classList.remove("active");
          } else if (newBoardModal.classList.contains("active")) {
            closeNewBoardModal();
          } else if (boardManagerModal.classList.contains("active")) {
            closeBoardManager();
          } else if (shareBoardModal.classList.contains("active")) {
            closeShareBoardModal();
          } else if (teacherAuthModal.classList.contains("active")) {
            closeTeacherAuthModal();
          }
        }
      });

      // ======================================================================
      // Initialize Application
      // ======================================================================
      loadCurrentStudentNumber();
      loadFromStorage();
      const requestedBoardFound = applyBoardFromUrl();
      renderApp();
      const hasBoardParameter = new URLSearchParams(window.location.search).has("board");
      if (!hasBoardParameter || !requestedBoardFound) {
        openBoardManager();
      }
      initializeOnlineBoardContext().catch(error => {
        console.warn("Supabase Phase 1-A initialization was skipped:", error.message);
      });
      console.log("Padlet MVP loaded successfully.");
    })();
  </script>
</body>
</html>
